name: VirusTotal Post-Release Scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan (leave empty for latest)"
        required: false
        type: string

jobs:
  virustotal-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Release Info
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          
          if [ -z "$TAG" ]; then
            echo "No tag provided. Fetching latest release..."
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq .id)
          echo "id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Downloading assets for release ${{ steps.release_info.outputs.tag }}..."
          gh release download ${{ steps.release_info.outputs.tag }} --pattern "tiktok-rv-*.apk"

      - name: VirusTotal Upload and Update Release
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          echo "" > vt_links.txt
          echo "### 🛡️ VirusTotal Scan Results" >> vt_links.txt
          
          for apk in tiktok-rv-*.apk; do
            if [ ! -f "$apk" ]; then
              echo "No APKs found to upload."
              continue
            fi
            
            echo "Requesting upload URL for $apk..."
            UPLOAD_URL=$(curl -s -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            
            if [ "$UPLOAD_URL" = "null" ] || [ -z "$UPLOAD_URL" ]; then
              echo "Failed to get upload URL from VirusTotal!"
              continue
            fi
            
            echo "Uploading $apk (this may take a minute)..."
            curl -s -F "file=@$apk" -H "x-apikey: $VT_API_KEY" "$UPLOAD_URL" > /dev/null
            
            SHA256=$(sha256sum "$apk" | awk '{print $1}')
            VT_LINK="https://www.virustotal.com/gui/file/$SHA256"
            
            echo "- **$apk**: [View Analysis]($VT_LINK)" >> vt_links.txt
            echo "Upload complete. Link: $VT_LINK"
          done
          
          echo "Appending links to release notes for $TAG..."
          # Fetch current notes, append new links, and update
          gh release view "$TAG" --json body -q .body > current_notes.md
          cat vt_links.txt >> current_notes.md
          gh release edit "$TAG" --notes-file current_notes.md
