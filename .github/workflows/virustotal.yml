name: VirusTotal Post-Release Scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan (leave empty for latest)"
        required: false
        type: string

jobs:
  virustotal-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Release Info
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          
          if [ -z "$TAG" ]; then
            echo "No tag provided. Fetching latest release..."
            TAG=$(gh release view --json tagName -jq .tagName)
          fi
          
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq .id)
          echo "id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Downloading assets for release ${{ steps.release_info.outputs.tag }}..."
          gh release download ${{ steps.release_info.outputs.tag }} --pattern "tiktok-rv-*.apk"

      - name: VirusTotal Scan
        uses: cssnr/virustotal-action@v1
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GH_PAT }}
          file_globs: tiktok-rv-*.apk
          release_id: ${{ steps.release_info.outputs.id }}
          update_release: true
